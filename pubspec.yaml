name: agenda_cultural
description: "Agenda Cultural Belém — app de eventos com notificações push (Flutter + Firebase Cloud Messaging)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase (plano gratuito Spark)
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # Ponte com o service worker na versão web
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/eventos/
